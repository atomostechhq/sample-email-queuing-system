services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672"    # AMQP port
      - "15672:15672"  # Management UI port
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - shared_network

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: your_db_user
      POSTGRES_PASSWORD: your_db_password
      POSTGRES_DB: your_db_name
    ports:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shared_network

  email_worker:
    build: ./email_worker  
    container_name: email_worker
    environment:
      NODE_ENV: production
      # RabbitMQ configuration
      RABBITMQ_URL: amqp://rabbitmq:5672
      EMAIL_QUEUE: emailQueue
      # Email configuration
      EMAIL_FROM: no-reply@yourdomain.com
      AWS_SMTP_HOST: smtp.aws-region.amazonaws.com    
      AWS_SMTP_PORT: "465" # 587 for TLS (or 465 if using SSL)
      AWS_SMTP_USER: your_aws_smtp_user
      AWS_SMTP_PASSWORD: your_aws_smtp_password
      # PostgreSQL 
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: your_db_user
      PGPASSWORD: your_db_password
      PGDATABASE: your_db_name
    depends_on:
      - rabbitmq
      - postgres
    networks:
      - shared_network

  email_producer:
    build: ./email_producer  
    container_name: email_producer
    environment:
      NODE_ENV: production
      # RabbitMQ configuration
      RABBITMQ_URL: amqp://rabbitmq:5672
      EMAIL_QUEUE: emailQueue
    ports:
      - "3000:3000" 
    depends_on:
      - rabbitmq
    networks:
      - shared_network

networks:
  shared_network:
    driver: bridge

volumes:
  rabbitmq-data:
  postgres-data:
